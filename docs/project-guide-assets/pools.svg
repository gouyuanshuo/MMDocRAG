<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
<title id="title">三个候选池的范围</title><desc id="desc">canonical 和 selfbuilt 共享问题、文档与图片侧。full image pool 补齐像素候选，但未补齐图片描述，因此不能不对称地比较方法。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#47677a"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#183444} .label{font-size:21px;font-weight:700} .body{font-size:17px} .small{font-size:16px;fill:#4a626d} .edge{fill:none;stroke:#47677a;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="960" height="330" fill="#ffffff"/>
<rect x="20" y="25" width="290" height="185" rx="9" fill="#eef5f7" stroke="#b9cdd5"/><text x="165.0" y="56" class="label" text-anchor="middle">canonical</text><text x="165.0" y="84" class="body" text-anchor="middle">官方候选并集</text><text x="165.0" y="109" class="body" text-anchor="middle">证据身份与描述较完整</text><text x="165.0" y="134" class="body" text-anchor="middle">池受到问题集合筛选</text><text x="165.0" y="159" class="body" text-anchor="middle">适合固定池方法比较</text><rect x="335" y="25" width="290" height="185" rx="9" fill="#eef5f7" stroke="#b9cdd5"/><text x="480.0" y="56" class="label" text-anchor="middle">selfbuilt</text><text x="480.0" y="84" class="body" text-anchor="middle">重新构造文字 chunk</text><text x="480.0" y="109" class="body" text-anchor="middle">92,752 块 / 220 篇文档</text><text x="480.0" y="134" class="body" text-anchor="middle">图片侧沿用已有材料</text><text x="480.0" y="159" class="body" text-anchor="middle">检查文字池敏感性</text><rect x="650" y="25" width="290" height="185" rx="9" fill="#eef5f7" stroke="#b9cdd5"/><text x="795.0" y="56" class="label" text-anchor="middle">full image pool</text><text x="795.0" y="84" class="body" text-anchor="middle">磁盘全图片供 ColQwen</text><text x="795.0" y="109" class="body" text-anchor="middle">220 / 220 文档已索引</text><text x="795.0" y="134" class="body" text-anchor="middle">额外图片描述尚不完整</text><text x="795.0" y="159" class="body" text-anchor="middle">检查像素检索池效应</text><text x="320" y="254" class="label" text-anchor="middle">前两池共享样本，不是独立复制</text><text x="480" y="295" class="small" text-anchor="middle">跨方法比较要控制同一个池；扩池造成的变化需要同题配对测量。</text></svg>