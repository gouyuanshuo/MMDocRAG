<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" role="img" aria-labelledby="title desc">
<title id="title">研究路线图</title><desc id="desc">测量基础、静态配置、预算路由已有研究结果；下一步先补已有回答盲评，再冻结E39生成及在线效率，最后做新文档确认。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#47677a"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#183444} .label{font-size:21px;font-weight:700} .body{font-size:17px} .small{font-size:16px;fill:#4a626d} .edge{fill:none;stroke:#47677a;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="960" height="570" fill="#ffffff"/>
<rect x="20" y="55" width="280" height="130" rx="9" fill="#eef7f2" stroke="#b9cdd5"/><text x="160.0" y="86" class="label" text-anchor="middle">01 测量基础</text><text x="160.0" y="114" class="body" text-anchor="middle">E1–E7 与 E28、E31–E33</text><text x="160.0" y="139" class="body" text-anchor="middle">身份、分母、可复算</text><rect x="340" y="55" width="280" height="130" rx="9" fill="#eef7f2" stroke="#b9cdd5"/><text x="480.0" y="86" class="label" text-anchor="middle">02 静态配置</text><text x="480.0" y="114" class="body" text-anchor="middle">E27、E29、E30、E40、E41</text><text x="480.0" y="139" class="body" text-anchor="middle">召回与引用 F1 的证据</text><rect x="660" y="55" width="280" height="130" rx="9" fill="#eef5f7" stroke="#b9cdd5"/><text x="800.0" y="86" class="label" text-anchor="middle">03 预算路由</text><text x="800.0" y="114" class="body" text-anchor="middle">E35–E38</text><text x="800.0" y="139" class="body" text-anchor="middle">GPU 部分信号，仍属探索</text><rect x="20" y="330" width="280" height="130" rx="9" fill="#fff5e5" stroke="#b9cdd5"/><text x="160.0" y="361" class="label" text-anchor="middle">04 补答案盲评</text><text x="160.0" y="389" class="body" text-anchor="middle">优先复用 E29 保存回答</text><text x="160.0" y="414" class="body" text-anchor="middle">正确性与忠实度</text><rect x="340" y="330" width="280" height="130" rx="9" fill="#fff5e5" stroke="#b9cdd5"/><text x="480.0" y="361" class="label" text-anchor="middle">05 冻结并执行 E39</text><text x="480.0" y="389" class="body" text-anchor="middle">生成引用非劣与在线计时</text><text x="480.0" y="414" class="body" text-anchor="middle">模型、边界、预算先明确</text><rect x="660" y="330" width="280" height="130" rx="9" fill="#f1f0f8" stroke="#b9cdd5"/><text x="800.0" y="361" class="label" text-anchor="middle">06 新文档确认</text><text x="800.0" y="389" class="body" text-anchor="middle">冻结完整方法与评价规则</text><text x="800.0" y="414" class="body" text-anchor="middle">检验外部泛化</text><text x="20" y="30" class="label" text-anchor="start">已完成或已有部分结果</text><text x="20" y="305" class="label" text-anchor="start">建议下一步顺序</text><path d="M300 120 H332" class="edge"/><path d="M620 120 H652" class="edge"/><path d="M800 185 V238 H160 V315" class="edge"/><path d="M300 395 H332" class="edge"/><path d="M620 395 H652" class="edge"/><text x="480" y="520" class="small" text-anchor="middle">扩展复杂方法之前，先补上研究主张缺少的终点与效率测量。</text><text x="480" y="550" class="small" text-anchor="middle">未支持原假设的实验仍是研究结果；未来工作没有被提前记为完成。</text></svg>