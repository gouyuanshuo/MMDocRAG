<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
<title id="title">E39 所准备的 GPU 级联</title><desc id="desc">先运行 dense 文字和 BM25 图片描述。router 根据实际首轮信号决定保留或升级为 RRF 文字和 ColQwen。600题中118题升级。尚未生成答案。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#47677a"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#183444} .label{font-size:21px;font-weight:700} .body{font-size:17px} .small{font-size:16px;fill:#4a626d} .edge{fill:none;stroke:#47677a;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="960" height="510" fill="#ffffff"/>
<rect x="255" y="20" width="450" height="104" rx="9" fill="#eef5f7" stroke="#b9cdd5"/><text x="480.0" y="51" class="label" text-anchor="middle">所有题先执行 cheap</text><text x="480.0" y="79" class="body" text-anchor="middle">dense 文字 + BM25 图片描述</text><text x="480.0" y="104" class="body" text-anchor="middle">2 CPU pass / 0 GPU pass</text><path d="M480 124 V156" class="edge"/><rect x="255" y="164" width="450" height="86" rx="9" fill="#eef5f7" stroke="#b9cdd5"/><text x="480.0" y="195" class="label" text-anchor="middle">router 预测升级收益</text><text x="480.0" y="223" class="body" text-anchor="middle">只看当时可用的特征与实际首轮结果</text><path d="M380 250 V277 H237 V300" class="edge"/><path d="M580 250 V277 H723 V300" class="edge"/><rect x="35" y="310" width="404" height="116" rx="9" fill="#eef7f2" stroke="#b9cdd5"/><text x="237.0" y="341" class="label" text-anchor="middle">保留 cheap</text><text x="237.0" y="369" class="body" text-anchor="middle">482 / 600 题</text><text x="237.0" y="394" class="body" text-anchor="middle">总计 2 CPU / 0 GPU pass</text><rect x="521" y="310" width="404" height="116" rx="9" fill="#fff5e5" stroke="#b9cdd5"/><text x="723.0" y="341" class="label" text-anchor="middle">升级 expensive</text><text x="723.0" y="369" class="body" text-anchor="middle">118 / 600 题</text><text x="723.0" y="394" class="body" text-anchor="middle">总计 3 CPU / 1 GPU pass</text><text x="480" y="463" class="small" text-anchor="middle">升级结果：RRF 文字 + ColQwen 像素检索；候选配额均为 5 / 5。</text><text x="480" y="493" class="small" text-anchor="middle">这些是保存决策与成本计数。E39 生成质量和实际端到端时间尚未测量。</text></svg>