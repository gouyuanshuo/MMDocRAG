<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">从文档到评价</title><desc id="desc">离线解析和表示建立证据池。在线根据问题检索、选候选、生成答案，再分别评价检索、引用、正确性、忠实度和成本。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#47677a"/></marker></defs>
<style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#183444} .label{font-size:21px;font-weight:700} .body{font-size:17px} .small{font-size:16px;fill:#4a626d} .edge{fill:none;stroke:#47677a;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="960" height="400" fill="#ffffff"/>
<text x="25" y="30" class="label" text-anchor="start">离线准备</text><rect x="25" y="50" width="230" height="116" rx="9" fill="#eef5f7" stroke="#b9cdd5"/><text x="140.0" y="81" class="label" text-anchor="middle">PDF 与官方材料</text><text x="140.0" y="109" class="body" text-anchor="middle">文字层与 OCR</text><text x="140.0" y="134" class="body" text-anchor="middle">图片与已有描述</text><rect x="330" y="50" width="255" height="116" rx="9" fill="#eef5f7" stroke="#b9cdd5"/><text x="457.5" y="81" class="label" text-anchor="middle">统一证据身份</text><text x="457.5" y="109" class="body" text-anchor="middle">文档 / 页面 / layout</text><text x="457.5" y="134" class="body" text-anchor="middle">gold 映射与覆盖检查</text><rect x="660" y="50" width="275" height="116" rx="9" fill="#eef5f7" stroke="#b9cdd5"/><text x="797.5" y="81" class="label" text-anchor="middle">索引与候选池</text><text x="797.5" y="109" class="body" text-anchor="middle">文字向量与词频</text><text x="797.5" y="134" class="body" text-anchor="middle">图片描述 / 图片像素</text><path d="M255 108 H320" class="edge"/><path d="M585 108 H650" class="edge"/><text x="25" y="210" class="label" text-anchor="start">在线查询及独立终点</text><rect x="25" y="232" width="184" height="116" rx="9" fill="#f6f8fa" stroke="#b9cdd5"/><text x="117.0" y="263" class="label" text-anchor="middle">问题</text><text x="117.0" y="291" class="body" text-anchor="middle">已知目标文档</text><text x="117.0" y="316" class="body" text-anchor="middle">当前实验范围</text><rect x="267" y="232" width="184" height="116" rx="9" fill="#f6f8fa" stroke="#b9cdd5"/><text x="359.0" y="263" class="label" text-anchor="middle">检索和路由</text><text x="359.0" y="291" class="body" text-anchor="middle">选择动作与配额</text><text x="359.0" y="316" class="body" text-anchor="middle">返回 top-k 候选</text><rect x="509" y="232" width="184" height="116" rx="9" fill="#f6f8fa" stroke="#b9cdd5"/><text x="601.0" y="263" class="label" text-anchor="middle">生成与引用</text><text x="601.0" y="291" class="body" text-anchor="middle">读候选并作答</text><text x="601.0" y="316" class="body" text-anchor="middle">输出引用编号</text><rect x="751" y="232" width="184" height="116" rx="9" fill="#f6f8fa" stroke="#b9cdd5"/><text x="843.0" y="263" class="label" text-anchor="middle">分层评价</text><text x="843.0" y="291" class="body" text-anchor="middle">召回 / 引用 / 事实</text><text x="843.0" y="316" class="body" text-anchor="middle">忠实度 / 时间 / 用量</text><path d="M209 290 H257" class="edge"/><path d="M451 290 H499" class="edge"/><path d="M693 290 H741" class="edge"/><text x="480" y="383" class="small" text-anchor="middle">找回证据、引用正确、事实正确与运行更快，需要分别提供证据。</text></svg>